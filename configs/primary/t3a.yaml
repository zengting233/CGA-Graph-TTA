data:
  root: ./data
  datasets: [Cora, CiteSeer, Cornell, Texas, Wisconsin, Chameleon, Squirrel]
  split: official
  geom_gcn_split: 0
  normalize_features: true
model:
  name: GraphSAGE
  hidden_dim: 64
  dropout: 0.5
  activation: elu
train:
  epochs: 200
  patience: 30
  optimizer: AdamW
  lr: 0.01
  weight_decay: 0.0005
shift:
  type: random_rewire
  severity: 0.5
adapt:
  mask: test
  alpha: 2.0
  eps: 1.0e-8
run:
  seeds: [0, 1, 2]
  device: auto
adapter: T3A
t3a:
  gate_transform: rank_20_80
  support_score: confidence_x_gate2
  confidence_quantile: 0.7
